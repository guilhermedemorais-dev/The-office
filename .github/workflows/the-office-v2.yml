name: The Office V2 regression
on:
  pull_request:
  push:
    branches: [feat/the-office-v2]
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/verify_preservation.py
      - run: python scripts/build_skill_routes.py --check
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
