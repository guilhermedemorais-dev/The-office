<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1470" viewBox="0 0 1100 1470" role="img" aria-labelledby="title desc"><title>The Office V2: fluxo de entrega por setor</title><desc>O setor consulta o catálogo. Se houver lacuna, pesquisa, adapta e valida a fonte, registra no catálogo e índices, e segue para execução. QA, documentação, métricas e aceite concluem o processo; rework retorna ao escopo afetado.</desc><rect width="1100" height="1470" fill="#f6f8fc" /><text x="550" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#16283c" font-weight="700"><tspan x="550" dy="0">The Office V2</tspan></text><text x="550" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#16283c" font-weight="400"><tspan x="550" dy="0">Responsabilidade por setor, catálogo compartilhado e evidências</tspan></text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52708f" /></marker></defs><rect x="310" y="110" width="480" height="80" rx="14" fill="#e8f1ff" stroke="#b3c2d6" stroke-width="2" /><text x="550.0" y="143.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#16283c" font-weight="400"><tspan x="550.0" dy="0">Produto e plano aprovados</tspan><tspan x="550.0" dy="26">PRD, módulos e prioridades</tspan></text><rect x="310" y="230" width="480" height="80" rx="14" fill="#e8f1ff" stroke="#b3c2d6" stroke-width="2" /><text x="550.0" y="263.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#16283c" font-weight="400"><tspan x="550.0" dy="0">Arquitetura e SDD</tspan><tspan x="550.0" dy="26">Uma Task por módulo; revisão atual</tspan></text><polyline points="550,190 550,230" fill="none" stroke="#52708f" stroke-width="2.5" stroke-linecap="round" /><polygon points="550,230 555.0,219.0 545.0,219.0" fill="#52708f" /><rect x="310" y="350" width="480" height="80" rx="14" fill="#ffffff" stroke="#b3c2d6" stroke-width="2" /><text x="550.0" y="383.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#16283c" font-weight="400"><tspan x="550.0" dy="0">Setor responsável consulta o índice</tspan><tspan x="550.0" dy="26">Recursos validados e catálogo central</tspan></text><polyline points="550,310 550,350" fill="none" stroke="#52708f" stroke-width="2.5" stroke-linecap="round" /><polygon points="550,350 555.0,339.0 545.0,339.0" fill="#52708f" /><polygon points="550,465 725,525 550,585 375,525" fill="#fff4d7" stroke="#b39236" stroke-width="2" /><text x="550" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#16283c" font-weight="400"><tspan x="550" dy="0">Recurso adequado</tspan><tspan x="550" dy="26">já catalogado?</tspan></text><polyline points="550,430 550,465" fill="none" stroke="#52708f" stroke-width="2.5" stroke-linecap="round" /><polygon points="550,465 555.0,454.0 545.0,454.0" fill="#52708f" /><rect x="765" y="640" width="300" height="100" rx="14" fill="#ffffff" stroke="#b3c2d6" stroke-width="2" /><text x="915.0" y="670.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#16283c" font-weight="400"><tspan x="915.0" dy="0">Pesquisar fontes oficiais</tspan><tspan x="915.0" dy="26">Adaptar e validar</tspan><tspan x="915.0" dy="26">Sem instalação automática</tspan></text><polyline points="725,525 915,525 915,640" fill="none" stroke="#52708f" stroke-width="2.5" stroke-linecap="round" /><polygon points="915,640 920.0,629.0 910.0,629.0" fill="#52708f" /><text x="950" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#16283c" font-weight="400"><tspan x="950" dy="0">Não</tspan></text><rect x="765" y="785" width="300" height="100" rx="14" fill="#ffffff" stroke="#b3c2d6" stroke-width="2" /><text x="915.0" y="815.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#16283c" font-weight="400"><tspan x="915.0" dy="0">Bibliotecário registra</tspan><tspan x="915.0" dy="26">Catálogo central e índices</tspan><tspan x="915.0" dy="26">Origem, revisão e evidências</tspan></text><polyline points="915,740 915,785" fill="none" stroke="#52708f" stroke-width="2.5" stroke-linecap="round" /><polygon points="915,785 920.0,774.0 910.0,774.0" fill="#52708f" /><rect x="310" y="690" width="390" height="90" rx="14" fill="#e9f7ee" stroke="#b3c2d6" stroke-width="2" /><text x="505.0" y="728.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#16283c" font-weight="400"><tspan x="505.0" dy="0">Executar o contrato aprovado</tspan><tspan x="505.0" dy="26">Skills selecionadas e tools reais</tspan></text><polyline points="550,585 550,690" fill="none" stroke="#52708f" stroke-width="2.5" stroke-linecap="round" /><polygon points="550,690 555.0,679.0 545.0,679.0" fill="#52708f" /><text x="580" y="632" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#16283c" font-weight="400"><tspan x="580" dy="0">Sim</tspan></text><polyline points="765,835 730,835 730,735 700,735" fill="none" stroke="#52708f" stroke-width="2.5" stroke-linecap="round" /><polygon points="700,735 711.0,740.0 711.0,730.0" fill="#52708f" /><rect x="310" y="825" width="390" height="90" rx="14" fill="#e9f7ee" stroke="#b3c2d6" stroke-width="2" /><text x="505.0" y="863.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#16283c" font-weight="400"><tspan x="505.0" dy="0">Validar e corrigir</tspan><tspan x="505.0" dy="26">QA e setores aplicáveis</tspan></text><polyline points="505,780 505,825" fill="none" stroke="#52708f" stroke-width="2.5" stroke-linecap="round" /><polygon points="505,825 510.0,814.0 500.0,814.0" fill="#52708f" /><rect x="15" y="825" width="245" height="90" rx="14" fill="#fff0ed" stroke="#b3c2d6" stroke-width="2" /><text x="137.5" y="863.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#16283c" font-weight="400"><tspan x="137.5" dy="0">Falha ou bloqueio</tspan><tspan x="137.5" dy="26">Retomar escopo afetado</tspan></text><polyline points="310,870 260,870" fill="none" stroke="#52708f" stroke-width="2.5" stroke-linecap="round" /><polygon points="260,870 271.0,875.0 271.0,865.0" fill="#52708f" /><polyline points="135,825 135,735 310,735" fill="none" stroke="#52708f" stroke-width="2.5" stroke-linecap="round" /><polygon points="310,735 299.0,730.0 299.0,740.0" fill="#52708f" /><rect x="310" y="960" width="390" height="90" rx="14" fill="#ffffff" stroke="#b3c2d6" stroke-width="2" /><text x="505.0" y="998.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#16283c" font-weight="400"><tspan x="505.0" dy="0">Documentação técnica e de uso</tspan><tspan x="505.0" dy="26">Tutorial real ou N/A com motivo</tspan></text><polyline points="505,915 505,960" fill="none" stroke="#52708f" stroke-width="2.5" stroke-linecap="round" /><polygon points="505,960 510.0,949.0 500.0,949.0" fill="#52708f" /><rect x="310" y="1095" width="390" height="90" rx="14" fill="#ffffff" stroke="#b3c2d6" stroke-width="2" /><text x="505.0" y="1133.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#16283c" font-weight="400"><tspan x="505.0" dy="0">Métricas e pacote de revisão</tspan><tspan x="505.0" dy="26">Fases, baseline, relatório e PR</tspan></text><polyline points="505,1050 505,1095" fill="none" stroke="#52708f" stroke-width="2.5" stroke-linecap="round" /><polygon points="505,1095 510.0,1084.0 500.0,1084.0" fill="#52708f" /><rect x="765" y="1095" width="300" height="90" rx="14" fill="#e8f1ff" stroke="#b3c2d6" stroke-width="2" /><text x="915.0" y="1120.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#16283c" font-weight="400"><tspan x="915.0" dy="0">Portal no projeto cliente</tspan><tspan x="915.0" dy="26">docs/portal/</tspan><tspan x="915.0" dy="26">Publicação tem gate próprio</tspan></text><polyline points="700,1140 765,1140" fill="none" stroke="#52708f" stroke-width="2.5" stroke-linecap="round" /><polygon points="765,1140 754.0,1135.0 754.0,1145.0" fill="#52708f" /><rect x="310" y="1230" width="390" height="90" rx="14" fill="#e8f1ff" stroke="#b3c2d6" stroke-width="2" /><text x="505.0" y="1268.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#16283c" font-weight="400"><tspan x="505.0" dy="0">Aceite humano</tspan><tspan x="505.0" dy="26">Merge e deploy separados</tspan></text><polyline points="505,1185 505,1230" fill="none" stroke="#52708f" stroke-width="2.5" stroke-linecap="round" /><polygon points="505,1230 510.0,1219.0 500.0,1219.0" fill="#52708f" /><text x="550" y="1380" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#16283c" font-weight="400"><tspan x="550" dy="0">TRIVIAL: intenção, check e fechamento compactos; não exige todas as fases.</tspan></text><text x="550" y="1415" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#53657b" font-weight="400"><tspan x="550" dy="0">Planos e arquivos copiados não comprovam execução, autenticação ou produção.</tspan></text></svg>